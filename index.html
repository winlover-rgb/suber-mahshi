*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#f6efdf;color:var(--ink);font-family:'Cairo',Tahoma,Arial,sans-serif}
a{color:inherit;text-decoration:none}
.hero{position:relative;overflow:hidden;background:linear-gradient(125deg,#0d2e17 0%,#1d5225 58%,#47752c 100%);color:white;padding:30px 20px 38px}
.hero:before,.hero:after{content:"";position:absolute;border:1px solid #ffffff24;border-radius:50%;width:360px;height:360px;left:-100px;top:-190px}
.hero:after{width:250px;height:250px;left:auto;right:-80px;top:auto;bottom:-190px}
.hero-inner{position:relative;z-index:1;max-width:1120px;margin:auto;display:grid;grid-template-columns:1.15fr .85fr;gap:26px;align-items:center}
.brand-mark{display:inline-flex;align-items:center;gap:10px;border:1px solid #d8b94d;border-radius:999px;padding:7px 15px;color:#ffe79a;font-weight:800;font-size:.9rem;background:#ffffff0d}
.brand-mark span{font-size:1.4rem}
h1{font-size:clamp(2.2rem,5vw,4.2rem);line-height:1.15;margin:16px 0 8px;font-weight:900;letter-spacing:-1px}
h1 em{font-style:normal;color:#ffdc71}
.hero p{font-size:1.05rem;line-height:1.9;color:#f8f0d7;max-width:620px;margin:10px 0 20px}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;padding:11px 18px;border-radius:999px;font-weight:800;transition:.2s}
.btn-primary{background:var(--gold);color:#2c351c}.btn-outline{border:1px solid #ffffff80;color:white}
.btn:hover{transform:translateY(-2px)}
.hero-photo{height:290px;border-radius:30px 100px 30px 30px;overflow:hidden;border:5px solid #ffffff26;box-shadow:0 20px 50px #071b0d55;transform:rotate(1deg)}
.hero-photo img{width:100%;height:100%;object-fit:cover}
.quickbar{max-width:1120px;margin:-20px auto 28px;position:relative;z-index:3;padding:0 18px}
.quickbar-inner{background:#fffdf5;border:1px solid var(--line);box-shadow:0 10px 30px #513d1b13;border-radius:18px;display:grid;grid-template-columns:repeat(3,1fr);overflow:hidden}
